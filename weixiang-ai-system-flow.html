<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偉翔通運 × 網緹系統　AI 輔助機制</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2;
    --warm-white: #FFFEF9;
    --ink: #1C1A17;
    --ink-light: #4A4640;
    --ink-muted: #8A867F;
    --gold: #C8973A;
    --gold-light: #F5E9CC;
    --border: rgba(28,26,23,0.10);
    --shadow-md: 0 6px 32px rgba(28,26,23,0.10);
    --radius: 12px;
  }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px 36px;
    box-shadow: var(--shadow-md);
    max-width: 760px;
    width: 100%;
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .header-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 13px;
    color: var(--ink-muted);
  }
  svg { display: block; width: 100%; }
  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-label">偉翔通運 · 系統管理</div>
    <h1>網緹系統 × AI 輔助機制</h1>
    <p>問題偵測流程　／　AI 只診斷，修復交廖先生</p>
  </div>

  <svg viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- 標題 -->
    <text font-family="Noto Serif TC, serif" font-size="15" font-weight="700" fill="#1C1A17" x="340" y="32" text-anchor="middle">偉翔通運 × 網緹系統　AI 輔助機制</text>

    <!-- 第一層：同仁操作系統 -->
    <rect x="240" y="50" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="340" y="72" text-anchor="middle" dominant-baseline="central">同仁操作系統</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#444441" x="340" y="90" text-anchor="middle" dominant-baseline="central">wscar.zzz.tw</text>

    <!-- 往下箭頭 -->
    <line x1="340" y1="102" x2="340" y2="136" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#8A867F" x="356" y="123" dominant-baseline="central">遇到問題</text>

    <!-- 第二層：AI 判斷中心 -->
    <rect x="200" y="136" width="280" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#26215C" x="340" y="158" text-anchor="middle" dominant-baseline="central">AI 判斷中心</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#3C3489" x="340" y="178" text-anchor="middle" dominant-baseline="central">已掌握系統全部功能架構</text>

    <!-- 往左、往右分叉箭頭 -->
    <line x1="240" y1="196" x2="148" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <line x1="440" y1="196" x2="532" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <!-- 分叉標籤 -->
    <text font-family="Noto Sans TC, sans-serif" font-size="11" fill="#8A867F" x="182" y="228" text-anchor="middle">操作問題</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="11" fill="#8A867F" x="498" y="228" text-anchor="middle">系統問題</text>

    <!-- 第三層左：操作邏輯問題 -->
    <rect x="40" y="250" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#04342C" x="140" y="272" text-anchor="middle" dominant-baseline="central">操作邏輯問題</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#085041" x="140" y="290" text-anchor="middle" dominant-baseline="central">同仁自己操作錯了</text>

    <!-- 第三層右：系統本身問題 -->
    <rect x="440" y="250" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="540" y="272" text-anchor="middle" dominant-baseline="central">系統本身問題</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#712B13" x="540" y="290" text-anchor="middle" dominant-baseline="central">Bug 或功能缺陷</text>

    <!-- 左側往下箭頭 -->
    <line x1="140" y1="306" x2="140" y2="350" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <!-- 右側往下箭頭 -->
    <line x1="540" y1="306" x2="540" y2="350" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <!-- 第四層左：告知正確操作 -->
    <rect x="40" y="350" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#04342C" x="140" y="370" text-anchor="middle" dominant-baseline="central">告知正確操作方式</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#085041" x="140" y="390" text-anchor="middle" dominant-baseline="central">同仁照做即可解決</text>

    <!-- 第四層右：AI 整理問題描述 -->
    <rect x="440" y="350" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="540" y="370" text-anchor="middle" dominant-baseline="central">AI 整理問題描述</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#712B13" x="540" y="390" text-anchor="middle" dominant-baseline="central">具體、清楚、可直接轉發</text>

    <!-- 右側往下箭頭 -->
    <line x1="540" y1="406" x2="540" y2="450" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <!-- 第五層：廖先生修復 -->
    <rect x="390" y="450" width="250" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="14" font-weight="500" fill="#412402" x="515" y="470" text-anchor="middle" dominant-baseline="central">廖先生（網緹）</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#633806" x="515" y="490" text-anchor="middle" dominant-baseline="central">收到具體問題點，直接修復</text>

    <!-- 底部強制限制說明框 -->
    <rect x="40" y="530" width="600" height="48" rx="8" fill="none" stroke="#B83232" stroke-width="0.8" stroke-dasharray="5 4"/>
    <text font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="500" fill="#B83232" x="340" y="549" text-anchor="middle" dominant-baseline="central">⚡ AI 強制限制</text>
    <text font-family="Noto Sans TC, sans-serif" font-size="12" fill="#8A867F" x="340" y="567" text-anchor="middle" dominant-baseline="central">只能偵測與整理問題　／　不得主動修改廖先生的任何程式碼</text>
  </svg>
</div>

<footer>偉翔通運股份有限公司　｜　策略幕僚 陳俊岳 整理　｜　2026.06.09</footer>
</body>
</html>
